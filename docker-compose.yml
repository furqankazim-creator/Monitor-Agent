# Initial single-host deployment. Web UI/API and the monitoring worker are SEPARATE processes sharing one data volume,
# so monitoring keeps running when the web container is restarted or no one is logged in.
x-env: &env
  env_file: .env
  environment:
    DATA_DIR: /app/data
services:
  web:
    build: { context: ., target: base }
    command: ["node", "src/server.js", "--role=web"]
    <<: *env
    restart: unless-stopped
    volumes: ["tgt-data:/app/data"]
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/auth/me').then(r=>process.exit(r.status===401||r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    build: { context: ., target: browser }   # includes Chromium for Playwright workflows
    command: ["node", "src/server.js", "--role=worker"]
    <<: *env
    restart: unless-stopped
    volumes: ["tgt-data:/app/data"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on: [web]
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro          # fullchain.pem + privkey.pem (e.g. from certbot)
    depends_on: [web]
  backup:
    image: alpine:3.20
    restart: unless-stopped
    volumes: ["tgt-data:/data:ro", "./backups:/backups"]
    entrypoint: ["/bin/sh", "-c"]
    command: ["apk add --no-cache sqlite >/dev/null && while true; do f=/backups/monitor-$$(date -u +%Y%m%dT%H%M%SZ).db; sqlite3 /data/monitor.db \".backup '$$f'\" && gzip $$f && find /backups -name 'monitor-*.db.gz' -mtime +14 -delete; sleep 21600; done"]
volumes:
  tgt-data:
